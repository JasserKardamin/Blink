{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h1 class="text-2xl mb-5">{{ title }}</h1>
<form method="post" enctype="multipart/form-data" class="card-pad space-y-4" novalidate>{% csrf_token %}
  {{ form.non_field_errors }}
  {% for field in form %}{% include "partials/form_field.html" %}{% endfor %}
  <div class="flex gap-3 pt-2">
    <button class="btn-primary">Enregistrer</button>
    <a href="javascript:history.back()" class="btn-outline">Annuler</a>
  </div>
</form>
{% endblock %}
