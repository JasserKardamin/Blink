{% extends "base.html" %}
{% block title %}Commentaire{% endblock %}
{% block content %}
<h1 class="text-2xl mb-5">{% if object %}Modifier le commentaire{% else %}Commenter{% endif %}</h1>
<form method="post" class="card-pad space-y-4">{% csrf_token %}
  {% include "partials/form_field.html" with field=form.contenu %}
  <div class="flex gap-3">
    <button class="btn-primary">Enregistrer</button>
    <a href="javascript:history.back()" class="btn-outline">Annuler</a>
  </div>
</form>
{% endblock %}
