{% load blink_tags %}
{# Enregistreur vocal : remplit l'input [data-recorder-input] du formulaire parent. #}
<div class="rounded-2xl bg-surface2 p-3" data-recorder>
  <div class="flex items-center gap-3">
    <button type="button" class="btn-mic shrink-0" data-rec-toggle aria-label="Enregistrer un message vocal">
      <span data-rec-icon-start>{% icon 'mic' 'w-5 h-5' %}</span>
      <span data-rec-icon-stop class="hidden">{% icon 'square' 'w-5 h-5' %}</span>
    </button>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-[3px] h-8" data-rec-wave>
        {% waveform 'recorder' 24 as bars %}
        {% for h in bars %}<span class="wave-bar !bg-salmon/40" style="height: {{ h }}%; animation-delay: {{ forloop.counter0 }}0ms"></span>{% endfor %}
      </div>
      <p class="text-xs text-muted mt-1" data-rec-status>{{ label|default:"Appuie sur le micro pour enregistrer" }}</p>
    </div>
    <span class="text-sm tabular-nums text-muted" data-rec-time>0:00</span>
    <button type="button" class="hidden btn-ghost btn-sm !p-2" data-rec-discard aria-label="Supprimer l'enregistrement">{% icon 'trash' 'w-4 h-4' %}</button>
  </div>
  <audio class="hidden w-full mt-3" controls data-rec-preview></audio>
  {% if allow_upload %}
    <label class="mt-2 inline-flex items-center gap-1 text-xs text-muted cursor-pointer hover:text-alice">
      {% icon 'upload' 'w-3 h-3' %} ou importer un fichier audio
      <input type="file" accept="audio/*" class="hidden" data-rec-upload>
    </label>
  {% endif %}
</div>
